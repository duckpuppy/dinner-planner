name: Build Android APK

# Reusable build. Callers: android-pr.yml (compile check), android-release.yml
# (signed prod release on v* tags), android-testing.yml (signed staging release
# on pushes to the testing branch).

on:
  workflow_call:
    inputs:
      flavor:
        description: 'Android product flavor (prod | staging)'
        required: true
        type: string
      build_type:
        description: 'Gradle build type (debug | release)'
        required: true
        type: string
      api_origin:
        description: 'Server origin baked into the web bundle as VITE_API_ORIGIN'
        required: true
        type: string
      version_name:
        description: 'Android versionName; also used as APP_VERSION for the web bundle'
        required: true
        type: string
      version_code:
        description: 'Android versionCode (must increase monotonically per applicationId)'
        required: true
        type: number
      ref:
        description: 'Git ref to check out (default: the triggering ref)'
        required: false
        type: string
        default: ''
      artifact_name:
        description: 'Name of the APK file and of the uploaded artifact'
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      apk_name:
        description: 'File name of the uploaded APK (equals the artifact name)'
        value: ${{ jobs.build.outputs.apk_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.flavor }} ${{ inputs.build_type }} APK
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.package.outputs.apk_name }}
    env:
      FLAVOR: ${{ inputs.flavor }}
      BUILD_TYPE: ${{ inputs.build_type }}
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}

    steps:
      - name: Validate inputs and signing secrets
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          case "$FLAVOR" in prod|staging) ;; *) echo "::error::flavor must be prod or staging, got '$FLAVOR'"; exit 1 ;; esac
          case "$BUILD_TYPE" in debug|release) ;; *) echo "::error::build_type must be debug or release, got '$BUILD_TYPE'"; exit 1 ;; esac
          if [ -n "$KEYSTORE_B64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            # An unsigned release APK cannot be installed, so it must never be published.
            if [ "$BUILD_TYPE" = release ]; then
              echo "::error::Release builds require the ANDROID_KEYSTORE_BASE64 secret (plus ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). See docs/deployment.md, Android App Build."
              exit 1
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @dinner-planner/shared build

      - name: Build web app
        run: pnpm --filter @dinner-planner/web build
        env:
          NODE_ENV: production
          APP_VERSION: ${{ inputs.version_name }}
          VITE_API_ORIGIN: ${{ inputs.api_origin }}

      - name: Sync Capacitor
        working-directory: apps/web
        run: npx cap sync android

      - name: Decode signing keystore
        if: ${{ steps.keystore.outputs.present == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KS_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KS_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble APK
        working-directory: apps/web/android
        run: |
          ./gradlew "assemble${FLAVOR^}${BUILD_TYPE^}" \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

      - name: Locate APK
        id: locate
        run: |
          DIR="apps/web/android/app/build/outputs/apk/${FLAVOR}/${BUILD_TYPE}"
          ls -la "$DIR"
          mapfile -t APKS < <(find "$DIR" -maxdepth 1 -name '*.apk')
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK in $DIR, found ${#APKS[@]}"
            exit 1
          fi
          if [ "$BUILD_TYPE" = release ] && [[ "${APKS[0]}" == *-unsigned.apk ]]; then
            echo "::error::Release APK is unsigned (${APKS[0]}); the signing config was not applied"
            exit 1
          fi
          echo "apk=${APKS[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        env:
          APK: ${{ steps.locate.outputs.apk }}
        run: |
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under ANDROID_HOME build-tools"
            exit 1
          fi
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Package APK
        id: package
        env:
          APK: ${{ steps.locate.outputs.apk }}
        run: |
          mkdir -p apk-out
          cp "$APK" "apk-out/$ARTIFACT_NAME"
          echo "apk_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: apk-out/${{ inputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30
